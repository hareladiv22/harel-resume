<!doctype html>
<!-- App icon template: "HA" in Fraunces on navy with a lime dot. ?s=<size in px>.
     Rendered to PNG by make-icons.mjs. Same design as public/icon.svg. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Fraunces;font-weight:600;src:url(../public/fonts/fraunces-latin-600-normal.woff2) format("woff2")}
*{margin:0}
html,body{overflow:hidden;background:#241A14}
svg{display:block}
</style>
</head>
<body>
<svg id="i" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#241A14"/>
  <text x="27" y="42" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="29" letter-spacing="-1" fill="#FBF3E6">HA</text>
  <circle cx="53.5" cy="39" r="4.5" fill="#FFCF5A"/>
</svg>
<script>
// Size the icon from the ?s= query (CSP is irrelevant here: this file is never deployed).
const s = +new URLSearchParams(location.search).get('s') || 64;
const i = document.getElementById('i'); i.setAttribute('width', s); i.setAttribute('height', s);
</script>
</body>
</html>
